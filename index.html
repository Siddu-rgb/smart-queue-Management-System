<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Price Direction Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📊 Stock Price Direction Predictor</h1>

    <label>Stock Symbol</label>
    <input type="text" id="symbol" placeholder="AAPL, TSLA">

    <label>Daily Return</label>
    <input type="number" id="return" step="0.01">

    <label>MA 5</label>
    <input type="number" id="ma5">

    <label>MA 10</label>
    <input type="number" id="ma10">

    <label>Volatility</label>
    <input type="number" id="volatility" step="0.01">

    <button onclick="predict()">Predict Direction</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
